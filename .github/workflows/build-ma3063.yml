name: Build RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - fix-ma3063-ethernet-luci
    paths:
      - 'target/linux/qualcommax/**'
      - '.github/workflows/build-ma3063.yml'

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget python3-pyelftools

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Feeds update and install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for RG-MA3063
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        run: make -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp bin/targets/qualcommax/ipq50xx/*ma3063* artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ma3063
          path: artifacts/
