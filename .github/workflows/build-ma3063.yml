name: Build RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - fix-ma3063-ethernet-luci
    paths:
      - 'target/linux/qualcommax/**'
      - '.github/workflows/build-ma3063.yml'

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget python3-pyelftools

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Feeds update and install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for RG-MA3063
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        run: |
          set -o pipefail
          # NOTE: jangan make clean/dirclean di sini — itu menghapus .config
          # hasil defconfig + hasil feeds install di atas.
          make -j$(nproc) 2>&1 | tee build.log | tail -n 100 || make -j1 V=s 2>&1 | tee build-verbose.log | tail -n 200

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp bin/targets/qualcommax/ipq50xx/*ma3063* artifacts/ 2>/dev/null || true
          ls -lh artifacts/ bin/targets/qualcommax/ipq50xx/ || true
          test -n "$(ls -A artifacts 2>/dev/null)" || { echo "ERROR: no ma3063 artifacts built"; exit 1; }

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ma3063
          path: artifacts/
